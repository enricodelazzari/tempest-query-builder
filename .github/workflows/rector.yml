name: Rector

on:
  # Restricted to the default branch, like the other workflows: a branch with an
  # open pull request is already covered by the `pull_request` trigger.
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'rector.php'
      - '.github/workflows/rector.yml'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - '.github/workflows/rector.yml'
      - 'composer.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rector:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Rector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, exif, iconv, fileinfo, readline
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Reports what Rector would change without touching the checkout, so the
      # job fails when the code drifts from the configured sets.
      - name: Run Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
